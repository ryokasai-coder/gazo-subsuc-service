<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>システムフローチャート — 画像作成サブスクサービス</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Segoe UI', 'Hiragino Sans', sans-serif; background: #F0F2F5; }

.page-header {
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  color: white; padding: 24px 40px;
  display: flex; align-items: center; gap: 14px;
}
.page-header-icon {
  width: 42px; height: 42px; background: #E60023;
  border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px;
}
.page-header h1 { font-size: 20px; font-weight: 800; }
.page-header p { font-size: 12px; color: #a0aec0; margin-top: 3px; }

/* タブ切替 */
.tabs { display: flex; gap: 0; background: white; border-bottom: 2px solid #E2E8F0; padding: 0 32px; position: sticky; top: 0; z-index: 100; }
.tab {
  padding: 14px 22px; font-size: 13px; font-weight: 600; color: #718096;
  cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
  transition: all 0.2s; white-space: nowrap;
}
.tab:hover { color: #E60023; }
.tab.active { color: #E60023; border-bottom-color: #E60023; }

.tab-content { display: none; padding: 32px; }
.tab-content.active { display: block; }

/* SVGキャンバス */
svg { display: block; overflow: visible; }

/* フローチャートノード */
.fc-wrap { display: flex; justify-content: center; overflow-x: auto; }

/* ノードスタイル（HTML上） */
.node-start, .node-end {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50px; padding: 10px 24px; font-size: 12px; font-weight: 800;
  color: white; letter-spacing: 0.04em;
}
.node-start { background: #1a1a2e; }
.node-end { background: #E60023; }

/* 凡例 */
.legend { display: flex; gap: 20px; flex-wrap: wrap; margin-bottom: 20px; align-items: center; }
.legend-item { display: flex; align-items: center; gap: 7px; font-size: 11px; color: #4a5568; font-weight: 600; }
.legend-box { width: 18px; height: 14px; border-radius: 3px; }
.legend-diamond { width: 16px; height: 16px; transform: rotate(45deg); border-radius: 2px; }

/* カラーパレット */
:root {
  --c-start:  #1a1a2e;
  --c-end:    #E60023;
  --c-user:   #3182CE;
  --c-admin:  #805AD5;
  --c-api:    #2F855A;
  --c-drive:  #1A73E8;
  --c-db:     #319795;
  --c-mail:   #DD6B20;
  --c-cron:   #D69E2E;
  --c-decide: #744210;
}
</style>
</head>
<body>

<div class="page-header">
  <div class="page-header-icon">🔀</div>
  <div>
    <h1>システムフローチャート</h1>
    <p>画像作成サブスクサービス（Next.js 14 + Supabase + Google Drive）</p>
  </div>
</div>

<!-- タブ -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('user')">👤 ユーザー登録・ログイン</div>
  <div class="tab" onclick="switchTab('request')">🎨 画像依頼フロー</div>
  <div class="tab" onclick="switchTab('admin')">🗂️ 管理者・納品フロー</div>
  <div class="tab" onclick="switchTab('cron')">⏰ Cron自動処理</div>
  <div class="tab" onclick="switchTab('full')">🗺️ 全体俯瞰</div>
</div>
